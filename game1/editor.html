<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blocksworld - Build &amp; Play</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/editor.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="rotate-warning">
    <div style="font-size: 48px;">📱↻</div>
    <h2>Vire o celular na horizontal</h2>
    <p style="color: #aaa; font-size: 14px;">O jogo roda deitado em proporção 4:3.</p>
  </div>

  <div id="app-container">
    <div id="screen-editor" class="screen">
      <div id="canvas-container"></div>

      <div class="editor-top-right">
        <a href="index.html" class="bw-round-icon" title="Back to Menu">⬇</a>
        <button class="bw-round-icon" id="btn-play" title="Play / Stop">▶</button>
      </div>

      <div id="left-dock" class="left-dock">
        <!-- Bandeja Laranja de Blocos sem barras extras -->
        <div class="orange-blocks-panel">
          <div class="blocks-grid-4">
            <button class="bw-shape-btn" draggable="true" data-block="rocket" title="Rocket">
              <svg viewBox="0 0 24 24"><path d="M12 2L17 12H7L12 2ZM9 12V19H15V12"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="wheel" title="Wheel">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="wedge" title="Wedge">
              <svg viewBox="0 0 24 24"><polygon points="5,19 19,19 5,6"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="cube" title="Cube">
              <svg viewBox="0 0 24 24"><polygon points="12,3 20,8 20,16 12,21 4,16 4,8"/><polyline points="4,8 12,13 20,8"/><line x1="12" y1="13" x2="12" y2="21"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="jump" title="Ramp">
              <svg viewBox="0 0 24 24"><polygon points="3,18 21,18 21,9"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="cylinder" title="Cylinder">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7V17C5 18.6 8.1 20 12 20C15.9 20 19 18.6 19 17V7"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="slope" title="Slope">
              <svg viewBox="0 0 24 24"><polygon points="4,18 20,18 12,7"/></svg>
            </button>
            <button class="bw-shape-btn" draggable="true" data-block="block" title="Block">
              <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
            </button>
          </div>
        </div>

        <!-- Cores 4x4 -->
        <div class="colors-matrix-4x4">
          <div class="color-cell" data-color="#ffaa00" style="background:#ffaa00;"></div>
          <div class="color-cell" data-color="#ff3b1f" style="background:#ff3b1f;"></div>
          <div class="color-cell" data-color="#7a7a7a" style="background:#7a7a7a;"></div>
          <div class="color-cell" data-color="#222222" style="background:#222222;"></div>
          <div class="color-cell" data-color="#ffe600" style="background:#ffe600;"></div>
          <div class="color-cell" data-color="#ff9933" style="background:#ff9933;"></div>
          <div class="color-cell" data-color="#b5b5b5" style="background:#b5b5b5;"></div>
          <div class="color-cell" data-color="#ffffff" style="background:#ffffff;"></div>
          <div class="color-cell" data-color="#33cc33" style="background:#33cc33;"></div>
          <div class="color-cell" data-color="#ff55cc" style="background:#ff55cc;"></div>
          <div class="color-cell" data-color="#1a8cff" style="background:#1a8cff;"></div>
          <div class="color-cell" data-color="#8844ff" style="background:#8844ff;"></div>
          <div class="color-cell" data-color="#99ff66" style="background:#99ff66;"></div>
          <div class="color-cell" data-color="#ffb3e6" style="background:#ffb3e6;"></div>
          <div class="color-cell" data-color="#80d4ff" style="background:#80d4ff;"></div>
          <div class="color-cell" data-color="#d9b3ff" style="background:#d9b3ff;"></div>
        </div>

        <!-- Texturas e Rostos -->
        <div class="textures-chars-panel">
          <div class="tex-grid-4x2">
            <div class="tex-tile" draggable="true" data-texture="wood" style="background:#9e5b34;" title="Wood">W</div>
            <div class="tex-tile" draggable="true" data-texture="brick" style="background:#b35c44;" title="Brick">B</div>
            <div class="tex-tile" draggable="true" data-texture="metal" style="background:#8a5a44;" title="Metal">M</div>
            <div class="tex-tile" draggable="true" data-texture="carbon" style="background:#333333;" title="Carbon">C</div>
          </div>
          <div class="chars-grid-4">
            <div class="char-face-tile" draggable="true" data-texture="face_dude" style="background:#f2b89b;" title="Dude"><span style="font-size:10px;">• •</span><span style="font-size:7px;">DUDE</span></div>
            <div class="char-face-tile" draggable="true" data-texture="face_boy" style="background:#f2b89b;" title="Boy"><span style="font-size:10px;">• • Ɐ</span><span style="font-size:7px;">BOY</span></div>
            <div class="char-face-tile" draggable="true" data-texture="face_cat" style="background:#f2b89b;" title="Cat"><span style="font-size:10px;">=^=</span><span style="font-size:7px;">CAT</span></div>
            <div class="char-face-tile" draggable="true" data-texture="face_eye" style="background:#f2b89b;" title="Face"><span style="font-size:11px;">👁️</span><span style="font-size:7px;">FACE</span></div>
          </div>
        </div>

        <!-- Programação -->
        <div class="programming-tiles-drawer">
          <div class="code-grid-4">
            <div class="mini-code-tile orange" draggable="true" data-code="FIRE"><span class="ico">🔥</span><span>FIRE</span></div>
            <div class="mini-code-tile orange" draggable="true" data-code="SPIN"><span class="ico">⚙️</span><span>SPIN</span></div>
            <div class="mini-code-tile orange" draggable="true" data-code="BOOST"><span class="ico">🚀</span><span>GO</span></div>
            <div class="mini-code-tile orange" draggable="true" data-code="STOP"><span class="ico">⏹</span><span>STOP</span></div>
          </div>
          <div class="code-grid-4">
            <div class="mini-code-tile blue" draggable="true" data-code="TAP LEFT"><span class="ico">👈</span><span>LEFT</span></div>
            <div class="mini-code-tile blue" draggable="true" data-code="TAP RIGHT"><span class="ico">👉</span><span>RIGHT</span></div>
            <div class="mini-code-tile blue" draggable="true" data-code="TAP UP"><span class="ico">👆</span><span>TAP</span></div>
            <div class="mini-code-tile blue" draggable="true" data-code="TILT"><span class="ico">📱</span><span>TILT</span></div>
          </div>
        </div>
      </div>

      <div id="bw-block-gizmo" class="bw-block-gizmo hidden">
        <button class="gizmo-action" id="btn-delete" title="Delete">✕</button>
        <button class="gizmo-action" id="btn-rotate" title="Rotate">↻</button>
      </div>

<div id="rocket-logic-popup" class="rocket-logic-popup hidden">
        <div class="logic-row">
          <div class="logic-slot" id="slot-event" title="Arraste um evento azul aqui">▶</div>
          <div class="logic-slot filled" id="slot-action" style="background:#ff661a;"><span class="ico">🚀</span><span style="font-size:6px;">FIRE</span></div>
        </div>
      </div>
        </div>
      </div>

      <div id="play-left-touch-area" class="hidden" title="Hold Left Side"></div>
    </div>
  </div>

  <script src="js/editor.js"></script>
</body>
</html>
