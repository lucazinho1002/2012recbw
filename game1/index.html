<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blocksworld - Main Menu</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div id="rotate-warning">
    <div style="font-size: 48px;">📱↻</div>
    <h2>Vire o celular na horizontal</h2>
    <p style="color: #aaa; font-size: 14px;">O jogo roda deitado em proporção 4:3.</p>
  </div>

  <div id="app-container">
    <div id="screen-menu" class="screen">
      <div class="menu-brand-col">
        <div class="vertical-brand-text">BLOCKSWORLD</div>
      </div>

      <div class="menu-scroll-columns" id="featured-worlds-grid">
        <!-- 8 mundos em destaque -->
        <a href="editor.html?world=rocket" class="world-thumb-card"><div class="thumb-art-center">🚀</div><div class="thumb-label">Rocket Test</div></a>
        <a href="editor.html?world=car" class="world-thumb-card"><div class="thumb-art-center">🏎️</div><div class="thumb-label">Car &amp; Jump</div></a>
        <a href="editor.html?world=alien" class="world-thumb-card"><div class="thumb-art-center">👤</div><div class="thumb-label">Characters</div></a>
        <a href="editor.html?world=tower" class="world-thumb-card"><div class="thumb-art-center">🗼</div><div class="thumb-label">Tower Fall</div></a>
        <a href="editor.html?world=airplane" class="world-thumb-card"><div class="thumb-art-center">✈️</div><div class="thumb-label">Flight</div></a>
        <a href="editor.html?world=boat" class="world-thumb-card"><div class="thumb-art-center">⛵</div><div class="thumb-label">Ocean Wave</div></a>
        <a href="editor.html?world=castle" class="world-thumb-card"><div class="thumb-art-center">🏰</div><div class="thumb-label">Castle Siege</div></a>
        <a href="editor.html?world=empty" class="world-thumb-card"><div class="thumb-art-center">🧱</div><div class="thumb-label">Empty Grid</div></a>
      </div>

      <div class="menu-buttons-col">
        <a href="editor.html?world=rocket" class="bw-pill-btn">Get Started</a>
        <button id="btn-create-new-world" class="bw-pill-btn">New World</button>
        <a href="worlds.html" class="bw-pill-btn">My Worlds</a>
        <a href="other-worlds.html" class="bw-pill-btn">Other Worlds</a>
        <a href="settings.html" class="bw-pill-btn">Settings</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("btn-create-new-world").addEventListener("click", () => {
      const worldName = prompt("Digite o nome do novo mundo:", "My Awesome World");
      if (!worldName) return;
      const newId = "world_" + Date.now();
      let savedWorlds = JSON.parse(localStorage.getItem("bw_my_worlds") || "[]");
      savedWorlds.push({ id: newId, name: worldName });
      localStorage.setItem("bw_my_worlds", JSON.stringify(savedWorlds));
      localStorage.setItem(`bw_world_${newId}`, JSON.stringify([]));
      window.location.href = `editor.html?world=${newId}`;
    });
  </script>
</body>
</html>
