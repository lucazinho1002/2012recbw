<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blocksworld - My Worlds</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div id="rotate-warning">
    <div style="font-size: 48px;">📱↻</div>
    <h2>Vire o celular na horizontal</h2>
    <p style="color: #aaa; font-size: 14px;">O jogo roda deitado em proporção 4:3.</p>
  </div>

  <div id="app-container">
    <div class="screen subpage-screen">
      <div class="subpage-brand-col">
        <div class="vertical-brand-text">BLOCKSWORLD</div>
      </div>

      <div class="subpage-content">
        <div class="subpage-header">
          <h1>My Worlds</h1>
          <a href="index.html" class="bw-pill-btn" style="padding: 8px 18px;">←</a>
        </div>

        <div class="worlds-grid-list" id="my-worlds-container">
          <!-- Os mundos criados e salvos aparecem aqui dinamicamente -->
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button id="btn-new-world" class="bw-pill-btn" style="width: 180px;">+ New World</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function renderWorlds() {
      const container = document.getElementById("my-worlds-container");
      container.innerHTML = "";

      // Recupera a lista de mundos salvos no localStorage
      let savedWorlds = JSON.parse(localStorage.getItem("bw_my_worlds") || "[]");

      // Se não houver nenhum mundo salvo, cria um mundo padrão inicial
      if (savedWorlds.length === 0) {
        savedWorlds = [{ id: "my_custom_world", name: "My Sandbox World" }];
        localStorage.setItem("bw_my_worlds", JSON.stringify(savedWorlds));
      }

      savedWorlds.forEach(w => {
        const card = document.createElement("a");
        card.href = `editor.html?world=${w.id}`;
        card.className = "world-item-card";
        card.innerHTML = `
          <div class="world-item-art">🌍</div>
          <div class="world-item-title">${w.name}</div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById("btn-new-world").addEventListener("click", () => {
      const newId = "world_" + Date.now();
      let savedWorlds = JSON.parse(localStorage.getItem("bw_my_worlds") || "[]");
      savedWorlds.push({ id: newId, name: `World ${savedWorlds.length + 1}` });
      localStorage.setItem("bw_my_worlds", JSON.stringify(savedWorlds));
      
      // Direciona para o editor com o novo ID de mundo
      window.location.href = `editor.html?world=${newId}`;
    });

    document.addEventListener("DOMContentLoaded", renderWorlds);
  </script>
</body>
</html>
