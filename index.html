<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2012recbw</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Barra Superior */
        .top-bar {
            background-color: #2c2c2c;
            height: 45px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #444;
            flex-shrink: 0;
        }

        .top-bar .logo {
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        .top-bar a {
            color: #66b2ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .top-bar a:hover {
            text-decoration: underline;
            color: #99ccff;
        }

        /* Área principal */
        .game-area {
            flex: 1;
            width: 100%;
            height: calc(100vh - 45px); /* Altura exata do que sobra da tela */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow: hidden;
        }

        /* O WebView (iframe) ajustado para nunca sair da tela */
        .webview-4-3 {
            aspect-ratio: 4 / 3;
            /* Calcula a maior largura possível sem estourar a altura nem a largura da tela */
            width: min(calc(100vw - 30px), calc((100vh - 75px) * (4 / 3)));
            height: auto;
            border: 2px solid #333;
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            display: block;
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo">2012recbw</div>
        <a href="versions.html">other versions</a>
    </header>

    <main class="game-area">
        <iframe 
            src="game/index.html" 
            class="webview-4-3" 
            title="2012recbw Game"
            allowfullscreen>
        </iframe>
    </main>

</body>
</html>
